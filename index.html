<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토츠카의 검 — 十拳剣</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #07060a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; }
  canvas { display: block; image-rendering: auto; cursor: crosshair; }
  #gl { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #game { position: relative; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="game"></canvas></div>
<!-- 3D 렌더링 (없거나 WebGL이 안 되면 2D 도트 렌더러로 대체) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
  // 개발 중 브라우저 캐시를 피하기 위해 매번 새로 불러온다 (순서 보장)
  window.BUILD = Date.now(); // 이미지도 같은 값으로 새로 불러온다 (js/core.js loadImg)
  ['core', 'iso', 'data', 'entities', 'map', 'render3d', 'enemies', 'bosses', 'game'].forEach(name => {
    const s = document.createElement('script');
    s.src = `js/${name}.js?v=${window.BUILD}`; s.async = false;
    document.body.appendChild(s);
  });
</script>
</body>
</html>
